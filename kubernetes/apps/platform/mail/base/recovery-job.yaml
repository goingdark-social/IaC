apiVersion: v1
kind: Pod
metadata:
  name: stalwart-v016-recovery
  namespace: stalwart
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/component: v016-recovery
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: stalwart
      image: stalwartlabs/stalwart:v0.16.9
      imagePullPolicy: IfNotPresent
      command: ["/usr/local/bin/stalwart"]
      args: ["--config", "/opt/stalwart/etc/config.json"]
      env:
        - name: HOSTNAME
          value: "mail.peekoff.com"
        - name: STALWART_RECOVERY_MODE
          value: "1"
        - name: STALWART_RECOVERY_ADMIN
          valueFrom:
            secretKeyRef:
              name: stalwart-recovery-admin
              key: credentials
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: data
          mountPath: /opt/stalwart
        - name: logs
          mountPath: /var/log/stalwart
        - name: config
          mountPath: /opt/stalwart/etc/config.json
          subPath: config.json
          readOnly: true
        - name: db-secrets
          mountPath: /opt/stalwart/db-secrets
          readOnly: true
        - name: s3-secrets
          mountPath: /opt/stalwart/s3-secrets
          readOnly: true
        - name: tls-certs
          mountPath: /opt/stalwart/etc/certs
          readOnly: true
        - name: tls-certs-goingdark
          mountPath: /opt/stalwart/etc/certs-goingdark
          readOnly: true
  volumes:
    - name: data
      emptyDir: {}
    - name: logs
      emptyDir: {}
    - name: config
      configMap:
        name: stalwart-config
    - name: db-secrets
      secret:
        secretName: stalwart-postgresql-app
    - name: s3-secrets
      secret:
        secretName: stalwart-blob-s3
    - name: tls-certs
      secret:
        secretName: stalwart-tls
        defaultMode: 0440
    - name: tls-certs-goingdark
      secret:
        secretName: stalwart-goingdark-tls
        defaultMode: 0440
