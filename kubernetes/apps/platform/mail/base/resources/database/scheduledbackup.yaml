---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: stalwart-postgresql-backup
spec:
  # Daily full base backup at 07:00 UTC.
  # Cron format (operator expects 6 fields): second minute hour day-of-month month day-of-week
  # "0 0 7 * * *" = 07:00:00 every day
  schedule: "0 0 7 * * *"
  backupOwnerReference: self
  cluster:
    name: stalwart-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: stalwart-cnpg-backup
