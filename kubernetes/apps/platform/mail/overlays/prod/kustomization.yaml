apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stalwart

images:
  - name: stalwartlabs/stalwart
    # Pinned: v0.16.9 fails to start against this cluster's existing data
    # ("Failed to parse data store settings ... expected value at line 1
    # column 1"), reproduced independent of the k8s manifest - the same
    # config/secrets work fine under v0.15.5. Do not bump past v0.15.5
    # until that's root-caused deliberately.
    newTag: v0.15.5

resources:
  - ../../base
  # config is generated from files so kustomize can update the name/checksum on change

configMapGenerator:
  - name: stalwart-config
    files:
      - files/config.toml

generatorOptions:
  disableNameSuffixHash: false

patches:
  - path: patches/hostnames.yaml
  - path: patches/storageclass.yaml

