apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-aio-passwords
  namespace: nextcloud
spec:
  # refreshInterval: "0" means never regenerate passwords automatically.
  # Passwords are generated once when this ExternalSecret is first created.
  refreshInterval: "0"
  target:
    name: nextcloud-aio-passwords
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: nextcloud-password-gen
      rewrite:
        - regexp:
            source: "password"
            target: "NEXTCLOUD_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: database-password-gen
      rewrite:
        - regexp:
            source: "password"
            target: "DATABASE_PASSWORD"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: redis-password-gen
      rewrite:
        - regexp:
            source: "password"
            target: "REDIS_PASSWORD"
